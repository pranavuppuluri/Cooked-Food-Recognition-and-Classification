<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14161d" />
    <title>HealthNow</title>
    <meta name="description" content="Point your camera at an Indian dish and HealthNow names it." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23FF7A59' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23FF7A59'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #14161d;
        --surface: #1c1f29;
        --surface-2: #242836;
        --line: #333848;
        --text: #eef0f6;
        --muted: #99a0b3;
        --accent: #ff7a59;
        --accent-soft: #ff7a5922;
        --good: #5bd6a0;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Instrument Sans", system-ui, sans-serif;
        min-height: 100svh;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 560px; margin: 0 auto; padding: 28px 16px 64px; }
      header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
      .dot { width: 30px; height: 30px; border-radius: 50%; border: 4px solid var(--accent); position: relative; flex: none; }
      .dot::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--accent); }
      h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em; margin: 0; }
      .sub { color: var(--muted); font-size: 15px; margin: 0 0 22px 42px; }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
      .stage {
        aspect-ratio: 4 / 3; border-radius: 14px; border: 1.5px dashed var(--line);
        background: var(--surface-2); display: grid; place-items: center; overflow: hidden; position: relative;
      }
      .stage img { width: 100%; height: 100%; object-fit: cover; display: none; }
      .stage.has-img img { display: block; }
      .stage.has-img .placeholder { display: none; }
      .placeholder { color: var(--muted); font-size: 15px; text-align: center; padding: 0 20px; }
      .placeholder svg { opacity: 0.5; margin-bottom: 8px; }
      .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
      button {
        font: inherit; font-weight: 600; cursor: pointer; border-radius: 12px; padding: 14px 10px;
        border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
        display: flex; align-items: center; justify-content: center; gap: 8px; transition: border-color .15s, transform .05s;
      }
      button:active { transform: translateY(1px); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #2a0f06; }
      button:hover { border-color: var(--accent); }
      input[type="file"] { display: none; }
      .gate { display: none; grid-template-columns: 1fr auto; gap: 10px; margin-top: 14px; }
      .gate.show { display: grid; }
      .gate input {
        font: inherit; border-radius: 12px; padding: 13px 14px; min-width: 0;
        border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
      }
      .gate input:focus { outline: none; border-color: var(--accent); }
      .gate button { white-space: nowrap; padding-left: 18px; padding-right: 18px; }
      .status { margin-top: 16px; min-height: 20px; color: var(--muted); font-size: 14px; text-align: center; }
      .status.err { color: #ff8f8f; }
      .results { margin-top: 18px; display: none; }
      .results.show { display: block; }
      .verdict {
        display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
        padding: 16px 18px; background: var(--accent-soft); border: 1px solid var(--accent);
        border-radius: 14px; margin-bottom: 14px;
      }
      .verdict .name { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
      .verdict .pct { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
      .row { margin: 10px 2px; }
      .row .top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
      .row .pct2 { color: var(--muted); font-variant-numeric: tabular-nums; }
      .bar { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
      .bar > span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--good)); }
      .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 26px; }
      .foot a { color: var(--muted); }
      .spin { display: inline-block; width: 15px; height: 15px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .7s linear infinite; vertical-align: -2px; margin-right: 7px; }
      @keyframes s { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <span class="dot" aria-hidden="true"></span>
        <h1>HealthNow</h1>
      </header>
      <p class="sub">Snap or upload a dish. The model names it from 37 Indian foods.</p>

      <div class="card">
        <div class="stage" id="stage">
          <div class="placeholder">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1L8 4h8l1.5 2h1A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.5"/></svg>
            <div>No photo yet</div>
          </div>
          <img id="preview" alt="" />
        </div>

        <div class="buttons">
          <button class="primary" id="camBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1L8 4h8l1.5 2h1A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.5"/></svg>
            Take photo
          </button>
          <button id="galBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 15l5-4 4 3 3-2 6 5"/></svg>
            From gallery
          </button>
        </div>
        <input type="file" id="camInput" accept="image/*" capture="environment" />
        <input type="file" id="galInput" accept="image/*" />

        <div class="gate" id="gate">
          <input type="password" id="pw" placeholder="Password to keep going" autocomplete="current-password" />
          <button id="pwBtn">Unlock</button>
        </div>

        <div class="status" id="status"></div>

        <div class="results" id="results">
          <div class="verdict">
            <span class="name" id="topName"></span>
            <span class="pct" id="topPct"></span>
          </div>
          <div id="rest"></div>
        </div>
      </div>

      <p class="foot">HealthNow &middot; served from devpranav &middot; <a href="https://unhuman.in">unhuman.in</a></p>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const stage = $("stage"), preview = $("preview"), status = $("status");
      const results = $("results"), rest = $("rest"), gate = $("gate");

      let pw = "";
      let lastFile = null;

      $("camBtn").onclick = () => $("camInput").click();
      $("galBtn").onclick = () => $("galInput").click();
      $("camInput").onchange = (e) => handle(e.target.files[0]);
      $("galInput").onchange = (e) => handle(e.target.files[0]);

      $("pwBtn").onclick = submitPw;
      $("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") submitPw(); });

      function submitPw() {
        pw = $("pw").value.trim();
        if (!pw) { $("pw").focus(); return; }
        if (lastFile) handle(lastFile);
      }

      async function handle(file) {
        if (!file) return;
        lastFile = file;
        preview.src = URL.createObjectURL(file);
        stage.classList.add("has-img");
        results.classList.remove("show");
        status.className = "status";
        status.innerHTML = '<span class="spin"></span>Looking at your dish…';

        const body = new FormData();
        body.append("image", file);
        if (pw) body.append("password", pw);
        try {
          const res = await fetch("predict", { method: "POST", body, credentials: "same-origin" });
          const data = await res.json();
          if (res.status === 401 && data.error === "password_required") {
            gate.classList.add("show");
            $("pw").focus();
            status.className = "status";
            status.textContent = data.message || "Enter the password to keep going.";
            return;
          }
          if (!res.ok) throw new Error(data.error || ("Server answered " + res.status));
          render(data.top || []);
          if (data.unlocked) {
            gate.classList.remove("show");
            status.textContent = "";
          } else if (data.free_left === 0) {
            gate.classList.add("show");
            status.textContent = "That was the free try. The next photo needs the password.";
          } else {
            status.textContent = "";
          }
        } catch (err) {
          status.className = "status err";
          status.textContent = err.message || "Could not reach the model.";
        }
      }

      function render(top) {
        if (!top.length) { status.textContent = "No guess came back."; return; }
        const pct = (p) => Math.round(p * 100) + "%";
        $("topName").textContent = top[0].dish;
        $("topPct").textContent = pct(top[0].prob);
        rest.innerHTML = top.slice(1).map((g) => `
          <div class="row">
            <div class="top"><span>${g.dish}</span><span class="pct2">${pct(g.prob)}</span></div>
            <div class="bar"><span style="width:${Math.max(2, g.prob * 100)}%"></span></div>
          </div>`).join("");
        results.classList.add("show");
      }
    </script>
  </body>
</html>
